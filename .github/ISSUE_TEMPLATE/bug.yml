name: Bug report
description: Report a reproducible defect that is not security-sensitive.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include keys, private RPC URLs, wallet credentials, or undisclosed vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and exact command.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment and evidence
      description: Include commit, tool versions, and sanitized output.
    validations:
      required: true
