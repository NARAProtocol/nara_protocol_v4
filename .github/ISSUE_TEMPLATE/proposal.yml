name: Change proposal
description: Propose a scoped protocol, tooling, or documentation change.
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete problem without assuming a solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Name affected contracts, scripts, consumers, and deferred work.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and deployment impact
      description: Describe authority, accounting, migration, and rollback considerations.
    validations:
      required: true
