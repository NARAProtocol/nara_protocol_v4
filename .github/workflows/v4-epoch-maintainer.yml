name: NARA v4 epoch maintainer

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Run the bounded epoch maintenance cycle"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nara-v4-operations-keeper
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'workflow_dispatch' || vars.V4_EPOCH_MAINTAINER_ENABLED == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 12
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Hydrate hash-pinned production configuration
        run: npm run v4:env:production:write
      - name: Verify production manifest and deployed runtime
        run: npm run verify:v4:runtime-config
      - name: Read-only health check
        if: github.event_name == 'workflow_dispatch' && inputs.execute != true
        run: npm run maintain:v4:epochs
      - name: Verify routine backlog is inside the automatic bound
        if: github.event_name == 'schedule' || inputs.execute == true
        env:
          V4_EPOCH_ALERT_WEBHOOK_URL: ${{ secrets.V4_EPOCH_ALERT_WEBHOOK_URL }}
        run: npm run maintain:v4:epochs:routine:check
      - name: Maintain epochs inside the routine bound
        if: github.event_name == 'schedule' || inputs.execute == true
        env:
          V4_EPOCH_KEEPER_ADDRESS: ${{ vars.V4_EPOCH_KEEPER_ADDRESS }}
          V4_EPOCH_KEEPER_PRIVATE_KEY: ${{ secrets.V4_EPOCH_KEEPER_PRIVATE_KEY }}
          V4_EPOCH_ALERT_WEBHOOK_URL: ${{ secrets.V4_EPOCH_ALERT_WEBHOOK_URL }}
          V4_EPOCH_HEARTBEAT_URL: ${{ secrets.V4_EPOCH_HEARTBEAT_URL }}
          V4_EPOCH_REQUIRE_HEARTBEAT: "true"
          V4_EPOCH_NOTIFY_RECOVERY: "true"
        run: npm run maintain:v4:epochs:routine
