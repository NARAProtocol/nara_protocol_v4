name: NARA v4 CI

on:
  # Feature branches are verified by pull_request. Restrict push verification
  # to main so one commit cannot start duplicate copies of every expensive job.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Node 20 needs the iterator-helper polyfill for Hardhat (see CLAUDE.md). Keep it on
# repository run steps only: job-level NODE_OPTIONS also affects actions before checkout.
jobs:
  # ── Blocking gate: must stay green ──────────────────────────────────────────
  build-test-size:
    name: build · test · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Compile
        run: npm run build
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs
      - name: Test (full v4 suite)
        run: npm test
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs
      - name: Treasury range settler tests
        run: npm run test:treasury-range-settler:v4
      - name: Treasury range settler strict TypeScript
        run: npm run typecheck:treasury-range-settler:v4
      - name: Bytecode size limits (24576 / 49152)
        run: npm run size
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs

  # ── Blocking static analysis ────────────────────────────────────────────────
  # Required-check context names retain "(advisory)" for branch-protection compatibility.
  slither:
    name: slither (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install slither-analyzer==0.11.3
      - name: Install pinned Solidity 0.8.34 for Slither
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.34+commit.80d5c536 \
            --output "$RUNNER_TEMP/solc-0.8.34"
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  $RUNNER_TEMP/solc-0.8.34" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/solc-0.8.34"
      - name: Slither (v4 production targets)
        run: |
          mapfile -t targets < <(find contracts/v4 -type f -name '*.sol' \
            ! -path '*/interfaces/*' ! -path '*/libraries/*' ! -path '*/mocks/*' \
            ! -name 'NARAEngineTypes.sol' | sort)
          test "${#targets[@]}" -ge 33
          printf '%s\n' "${targets[@]}" | grep -Fxq 'contracts/v4/NARATreasuryRangeManagerV1.sol'
          failed=0

          for target in "${targets[@]}"; do
            runs=1
            case "$target" in
              contracts/v4/NARAToken.sol|contracts/v4/NARALauncher.sol|contracts/v4/NARALiquidityGrowthHook.sol|contracts/v4/NARALiquidityGrowthVault.sol)
                runs=200
                ;;
            esac

            solc_args="--base-path . --include-path node_modules --optimize --optimize-runs $runs --via-ir --evm-version cancun"
            if [ "$target" = "contracts/v4/NARAEngine.sol" ]; then
              solc_args="$solc_args --metadata-hash none"
            fi

            echo "Slither: $target"
            if ! slither "$target" \
              --solc "$RUNNER_TEMP/solc-0.8.34" \
              --solc-working-dir . \
              --solc-remaps '@openzeppelin/=node_modules/@openzeppelin/ @uniswap/v4-core/=node_modules/@uniswap/v4-periphery/lib/v4-core/ @uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/' \
              --solc-args "$solc_args" \
              --filter-paths 'node_modules|contracts/test|contracts/v4/mocks|contracts/mocks|archive' \
              --exclude-informational \
              --exclude-low \
              --fail-none; then
              failed=$((failed + 1))
            fi
          done
          test "$failed" -eq 0

  aderyn:
    name: aderyn (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cyfrin retired Aderyn upstream and withdrew all release binaries/crates.
      # Retain the required "aderyn (advisory)" check context and enforce deterministic
      # Solidity v4 source/pragma/AST hygiene alongside the blocking Slither + Echidna jobs.
      - name: Solidity static hygiene gate (v4 production targets)
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const walk = (d) =>
              fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
                const full = path.join(d, e.name);
                return e.isDirectory() ? walk(full) : e.name.endsWith(".sol") ? [full] : [];
              });
            const targets = walk("contracts/v4").filter(
              (f) => !/[\\/](interfaces|libraries|mocks)[\\/]/.test(f) && !f.endsWith("NARAEngineTypes.sol")
            );
            if (targets.length < 33) throw new Error(`Expected >= 33 v4 targets, found ${targets.length}`);
            for (const f of targets) {
              const raw = fs.readFileSync(f, "utf8");
              const code = raw.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "");
              if (!raw.includes("SPDX-License-Identifier:")) throw new Error(`Missing SPDX header: ${f}`);
              if (!/pragma\s+solidity\s+0\.8\.34\s*;/.test(code)) throw new Error(`Unpinned pragma in ${f}`);
              if (/\b(selfdestruct|suicide)\s*\(/.test(code)) throw new Error(`Forbidden selfdestruct in ${f}`);
              if (/\btx\.origin\b/.test(code)) throw new Error(`Forbidden tx.origin in ${f}`);
            }
            console.log(`Verified ${targets.length} v4 production Solidity targets.`);
          '
          npx hardhat compile

  # ── Blocking property fuzzing of the engine invariants ──────────────────────
  echidna:
    name: echidna (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Echidna (v4 engine property harness)
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          files: echidna/harnesses/EchidnaNARAEngineV4Harness.sol
          contract: EchidnaNARAEngineV4Harness
          config: echidna/v4-engine.yaml
          echidna-version: v2.3.3
          solc-version: 0.8.34
          solc-args: --base-path . --include-path node_modules --optimize --optimize-runs 1 --via-ir --evm-version cancun --metadata-hash none
