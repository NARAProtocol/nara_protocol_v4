name: NARA v4 CI

on:
  # Feature branches are verified by pull_request. Restrict push verification
  # to main so one commit cannot start duplicate copies of every expensive job.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Node 20 needs the iterator-helper polyfill for Hardhat (see CLAUDE.md). Keep it on
# repository run steps only: job-level NODE_OPTIONS also affects actions before checkout.
jobs:
  # ── Blocking gate: must stay green ──────────────────────────────────────────
  build-test-size:
    name: build · test · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Compile
        run: npm run build
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs
      - name: Test (full v4 suite)
        run: npm test
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs
      - name: Bytecode size limits (24576 / 49152)
        run: npm run size
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs

  # ── Blocking static analysis ────────────────────────────────────────────────
  # Required-check context names retain "(advisory)" for branch-protection compatibility.
  slither:
    name: slither (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install slither-analyzer==0.11.3
      - name: Install pinned Solidity 0.8.34 for Slither
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.34+commit.80d5c536 \
            --output "$RUNNER_TEMP/solc-0.8.34"
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  $RUNNER_TEMP/solc-0.8.34" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/solc-0.8.34"
      - name: Slither (32 v4 production targets)
        run: |
          mapfile -t targets < <(find contracts/v4 -type f -name '*.sol' \
            ! -path '*/interfaces/*' ! -path '*/libraries/*' ! -path '*/mocks/*' \
            ! -name 'NARAEngineTypes.sol' | sort)
          test "${#targets[@]}" -eq 32
          failed=0

          for target in "${targets[@]}"; do
            runs=1
            case "$target" in
              contracts/v4/NARAToken.sol|contracts/v4/NARALauncher.sol|contracts/v4/NARALiquidityGrowthHook.sol|contracts/v4/NARALiquidityGrowthVault.sol)
                runs=200
                ;;
            esac

            solc_args="--base-path . --include-path node_modules --optimize --optimize-runs $runs --via-ir --evm-version cancun"
            if [ "$target" = "contracts/v4/NARAEngine.sol" ]; then
              solc_args="$solc_args --metadata-hash none"
            fi

            echo "Slither: $target"
            if ! slither "$target" \
              --solc "$RUNNER_TEMP/solc-0.8.34" \
              --solc-working-dir . \
              --solc-remaps '@openzeppelin/=node_modules/@openzeppelin/ @uniswap/v4-core/=node_modules/@uniswap/v4-periphery/lib/v4-core/ @uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/' \
              --solc-args "$solc_args" \
              --filter-paths 'node_modules|contracts/test|contracts/v4/mocks|contracts/mocks|archive' \
              --exclude-informational \
              --exclude-low \
              --fail-none; then
              failed=$((failed + 1))
            fi
          done
          test "$failed" -eq 0

  aderyn:
    name: aderyn (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Aderyn 0.6.8 (Cyfrin)
        env:
          ADERYN_DISABLE_UPDATE: "1"
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-installer.sh \
            --output /tmp/aderyn-installer.sh
          echo "6c005c222681f1349caa31aa7c9d55b0fd0ae779c0faad65e8eaa6dc872f8faf  /tmp/aderyn-installer.sh" | sha256sum --check
          sh /tmp/aderyn-installer.sh
      - name: Install pinned Solidity 0.8.34 for Aderyn
        run: |
          mkdir -p "$HOME/.svm/0.8.34"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.34+commit.80d5c536 \
            --output "$RUNNER_TEMP/solc-0.8.34"
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  $RUNNER_TEMP/solc-0.8.34" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/solc-0.8.34" "$HOME/.svm/0.8.34/solc-0.8.34"
      - name: Aderyn (v4 contracts)
        run: aderyn --src contracts/v4 .
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/polyfill.cjs

  # ── Blocking property fuzzing of the engine invariants ──────────────────────
  echidna:
    name: echidna (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Echidna (v4 engine property harness)
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          files: echidna/harnesses/EchidnaNARAEngineV4Harness.sol
          contract: EchidnaNARAEngineV4Harness
          config: echidna/v4-engine.yaml
          echidna-version: v2.3.3
          solc-version: 0.8.34
          solc-args: --base-path . --include-path node_modules --optimize --optimize-runs 1 --via-ir --evm-version cancun --metadata-hash none
