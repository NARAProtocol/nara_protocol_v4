name: NARA v4 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nara-v4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 20 needs the transient-storage polyfill for Hardhat (see CLAUDE.md). Setting it at the
# job level applies to every hardhat/tsx invocation, including those spawned by the analyzers.
jobs:
  # ── Blocking gate: must stay green ──────────────────────────────────────────
  build-test-size:
    name: build · test · size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Hardhat Node options
        run: echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/polyfill.cjs" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      - name: Dependency audit (High and Critical)
        run: npm audit --audit-level=high
      - name: Public repository integrity
        run: npm run verify:public
      - name: Compile
        run: npm run build
      - name: Test (full v4 suite)
        run: npm test
      - name: Bytecode size limits (24576 / 49152)
        run: npm run size

  # ── Free static analysis (advisory; review the output, don't ignore it) ──────
  slither:
    name: slither (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Configure Hardhat Node options
        run: echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/polyfill.cjs" >> "$GITHUB_ENV"
      - run: npm ci
      - run: pip install slither-analyzer
      - name: Slither (v4 production contracts)
        run: slither . --filter-paths "node_modules|contracts/v4/mocks|test" || true

  aderyn:
    name: aderyn (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Hardhat Node options
        run: echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/polyfill.cjs" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install Aderyn (Cyfrin)
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Cyfrin/aderyn/a288420403cb1ae5f38ce606c3a6d4e605b9c81d/cyfrinup/install | bash
          echo "$HOME/.cyfrin/bin" >> "$GITHUB_PATH"
      - name: Aderyn (v4 contracts)
        run: aderyn --src contracts/v4 . || true

  # ── Free property fuzzing of the engine invariants (advisory) ────────────────
  echidna:
    name: echidna (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install Solidity dependencies
        run: npm ci
      - name: Echidna (v4 engine property harness)
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        with:
          files: echidna/harnesses/EchidnaNARAEngineV4Harness.sol
          contract: EchidnaNARAEngineV4Harness
          config: echidna/v4-engine.yaml
          solc-version: 0.8.34
          solc-args: >-
            --base-path .
            --include-path node_modules
            --allow-paths .,node_modules
            --optimize
            --optimize-runs 1
            --via-ir
            --evm-version cancun
            --metadata-hash none
