version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      hardhat-development:
        patterns:
          - "@nomicfoundation/*"
          - "hardhat"
          - "mocha"
      solidity-dependencies:
        patterns:
          - "@openzeppelin/*"
          - "@uniswap/*"

