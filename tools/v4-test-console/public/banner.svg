    <linearGradient id="emeraldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/><stop offset="35%" stop-color="#083321"/><stop offset="100%" stop-color="#020D08"/>
    </linearGradient>
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4659"/><stop offset="50%" stop-color="#181F2C"/><stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <!-- Background Carbon Guilloche Lattice -->
    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6.9 L 24 20.7 L 12 27.6 L 0 20.7 L 0 6.9 Z" fill="none" stroke="rgba(56,189,248,0.04)" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background -->
