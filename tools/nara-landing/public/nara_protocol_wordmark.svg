<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Core letter linear gradient: Ice white highlight to electric cyan -->
    <linearGradient id="naraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#EBF8FF" />
      <stop offset="65%" stop-color="#70B8F8" />
      <stop offset="100%" stop-color="#2B82E4" />
    </linearGradient>

    <!-- Subtext gradient -->
    <linearGradient id="protocolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#DDF0FF" />
      <stop offset="100%" stop-color="#80C8F8" />
    </linearGradient>

    <!-- Laser beam gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="48%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="52%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing cyan bloom filter -->
    <filter id="naraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="centerFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#naraGlow)">
    <!-- ==================== N ==================== -->
    <path d="M 120 40 L 148 40 L 148 102 L 216 40 L 244 40 L 244 150 L 216 150 L 216 88 L 148 150 L 120 150 Z" fill="url(#naraGrad)" />

    <!-- ==================== A (1) ==================== -->
    <!-- Inverted Chevron without crossbar -->
    <path d="M 335 40 L 362 40 L 418 150 L 390 150 L 348.5 68 L 307 150 L 279 150 Z" fill="url(#naraGrad)" />

    <!-- ==================== R ==================== -->
    <!-- Upper loop & horizontal top bar -->
    <path d="M 465 40 L 535 40 C 565 40, 582 56, 582 80 C 582 96, 572 108, 554 114 L 554 88 C 557 85, 558 82, 558 78 C 558 64, 548 60, 530 60 L 465 60 Z" fill="url(#naraGrad)" />
    <!-- Lower structure: Left vertical stem, middle crossbar, and diagonal leg -->
    <path d="M 465 80 L 535 80 L 575 150 L 544 150 L 512 98 L 488 98 L 488 150 L 465 150 Z" fill="url(#naraGrad)" />

    <!-- ==================== A (2) ==================== -->
    <path d="M 672 40 L 699 40 L 755 150 L 727 150 L 685.5 68 L 644 150 L 616 150 Z" fill="url(#naraGrad)" />
  </g>

  <!-- ==================== PROTOCOL ==================== -->
  <g filter="url(#naraGlow)">
    <!-- P -->
    <path d="M 120 180 L 148 180 C 158 180, 164 186, 164 195 C 164 204, 158 210, 148 210 L 129 210 L 129 228 L 120 228 Z M 129 187 L 129 203 L 146 203 C 152 203, 155 200, 155 195 C 155 190, 152 187, 146 187 Z" fill="url(#protocolGrad)" />

    <!-- R -->
    <path d="M 205 180 L 233 180 C 243 180, 249 186, 249 195 C 249 202, 245 207, 238 209 L 251 228 L 240 228 L 228 210 L 214 210 L 214 228 L 205 228 Z M 214 187 L 214 203 L 231 203 C 237 203, 240 200, 240 195 C 240 190, 237 187, 231 187 Z" fill="url(#protocolGrad)" />

    <!-- O -->
    <path d="M 300 180 C 315 180, 324 189, 324 204 C 324 219, 315 228, 300 228 C 285 228, 276 219, 276 204 C 276 189, 285 180, 300 180 Z M 300 187 C 291 187, 285 194, 285 204 C 285 214, 291 221, 300 221 C 309 221, 315 214, 315 204 C 315 194, 309 187, 300 187 Z" fill="url(#protocolGrad)" />

    <!-- T -->
    <path d="M 360 180 L 402 180 L 402 187 L 385 187 L 385 228 L 376 228 L 376 187 L 360 187 Z" fill="url(#protocolGrad)" />

    <!-- O -->
    <path d="M 450 180 C 465 180, 474 189, 474 204 C 474 219, 465 228, 450 228 C 435 228, 426 219, 426 204 C 426 189, 435 180, 450 180 Z M 450 187 C 441 187, 435 194, 435 204 C 435 214, 441 221, 450 221 C 459 221, 465 214, 465 204 C 465 194, 459 187, 450 187 Z" fill="url(#protocolGrad)" />

    <!-- C -->
    <path d="M 548 187 L 548 180 C 533 180, 524 189, 524 204 C 524 219, 533 228, 548 228 L 548 221 C 539 221, 533 214, 533 204 C 533 194, 539 187, 548 187 Z" fill="url(#protocolGrad)" />

    <!-- O -->
    <path d="M 600 180 C 615 180, 624 189, 624 204 C 624 219, 615 228, 600 228 C 585 228, 576 219, 576 204 C 576 189, 585 180, 600 180 Z M 600 187 C 591 187, 585 194, 585 204 C 585 214, 591 221, 600 221 C 609 221, 615 214, 615 204 C 615 194, 609 187, 600 187 Z" fill="url(#protocolGrad)" />

    <!-- L -->
    <path d="M 675 180 L 684 180 L 684 221 L 712 221 L 712 228 L 675 228 Z" fill="url(#protocolGrad)" />
  </g>

  <!-- ==================== LASER DIVIDER & FLARES ==================== -->
  <g filter="url(#centerFlare)">
    <!-- Horizontal Laser Line -->
    <rect x="120" y="255" width="635" height="2" rx="1" fill="url(#laserGrad)" />

    <!-- Center Diamond Prism -->
    <polygon points="438,256 430,270 422,256 430,253" fill="#00F0FF" />
    <polygon points="436,256 430,266 424,256 430,254" fill="#FFFFFF" />

    <!-- Left Flare Beam -->
    <circle cx="85" cy="170" r="3.5" fill="#FFFFFF" />
    <circle cx="85" cy="170" r="8" fill="#00F0FF" opacity="0.4" />
    <line x1="20" y1="170" x2="105" y2="170" stroke="#00F0FF" stroke-width="1.5" />

    <!-- Right Flare Beam -->
    <circle cx="790" cy="170" r="3.5" fill="#FFFFFF" />
    <circle cx="790" cy="170" r="8" fill="#00F0FF" opacity="0.4" />
    <line x1="770" y1="170" x2="855" y2="170" stroke="#00F0FF" stroke-width="1.5" />
  </g>
</svg>